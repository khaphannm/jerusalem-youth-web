name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CMS_BASE_URL: https://cms.example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        run: npm run test:e2e

  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: 127.0.0.1
      PORT: 1337
      APP_KEYS: ci-only-key-one,ci-only-key-two
      API_TOKEN_SALT: ci-only-api-token-salt
      ADMIN_JWT_SECRET: ci-only-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-only-transfer-token-salt
      ENCRYPTION_KEY: ci-only-encryption-key
      JWT_SECRET: ci-only-users-permissions-jwt-secret
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: jerusalem_youth
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi-ci-only
      DATABASE_SSL: "false"
      AWS_REGION: auto
      AWS_BUCKET: ci-only-bucket
      AWS_ENDPOINT: https://s3.example.invalid
      AWS_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ci-only-access-key
      AWS_ACCESS_SECRET: ci-only-secret-key
      CDN_URL: https://cdn.example.invalid
      CDN_ROOT_PATH: ci
    defaults:
      run:
        working-directory: cms

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jerusalem_youth
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strapi -d jerusalem_youth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install CMS dependencies from lockfile
        run: npm ci

      - name: Audit CMS production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck CMS
        run: npm run typecheck

      - name: Test CMS content rules
        run: npm test

      - name: Build CMS admin
        run: npm run build

      - name: Verify CMS startup and public permissions
        env:
          NODE_ENV: production
        run: |
          npm run start &
          cms_pid=$!
          trap 'kill "$cms_pid"' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 http://localhost:1337/_health
          curl --fail --silent --show-error http://localhost:1337/api/articles > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"data":{}}' http://localhost:1337/api/articles)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://localhost:1337/api/upload)" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"username":"denied","email":"denied@example.invalid","password":"denied-in-ci"}' \
            http://localhost:1337/api/auth/local/register)" = "403"
