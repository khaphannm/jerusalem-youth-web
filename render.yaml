# Render Blueprint for the Strapi CMS on the free plan. See
# docs/free-hosting-setup.md. Values marked `sync: false` are entered in the
# Render dashboard and never stored in Git. Not yet exercised on Render.
services:
  - type: web
    name: jerusalem-youth-cms
    runtime: node
    plan: free
    rootDir: cms
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # Four comma-separated random values.
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Neon PostgreSQL. No idle connections, so the database can sleep.
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"
      # Cloudflare R2 uploads, delivered through the media Worker.
      - key: AWS_REGION
        value: auto
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_ACCESS_SECRET
        sync: false
      - key: AWS_FORCE_PATH_STYLE
        value: "true"
      - key: AWS_ACL
        value: none
      - key: CDN_URL
        sync: false
